# pytest.ini — projeto_autismo

[pytest]
testpaths = tests
python_files  = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings

markers =
    unit:        Testes unitários — sem I/O externo, sem banco de dados
    integration: Testes de integração — usam banco SQLite in-memory
    system:      Testes de sistema — fluxos completos ponta a ponta
    slow:        Testes lentos
    security:    Testes de segurança

[coverage:run]
source = app
concurrency = greenlet, thread
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 80

[coverage:html]
directory = htmlcov
title = projeto_autismo — Cobertura de Testes
