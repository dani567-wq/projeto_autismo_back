

  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">

  <body>
    <style>  
    *{
      box-sizing: 0;
        margin: 0;   
        padding: 0;
    }
  
     :root {
      --blue-deep:   #1a4a72;
      --blue-mid:    #2d6fa0;
      --blue-soft:   #4a90c4;
      --blue-pale:   #d6eaf8;
      --blue-ghost:  #eaf4fb;
      --teal:        #2a9d8f;
      --teal-light:  #a8dcd5;
      --warm:        #f4a261;
      --warm-pale:   #fdebd0;
      --bg:          #f7fafd;
      --surface:     #ffffff;
      --text:        #1c2b3a;
      --text-soft:   #4a6278;
      --text-muted:  #7a96ab;
      --border:      #c8dde9;
      --radius:      14px;
      --radius-lg:   22px;
      --shadow-sm:   0 2px 8px rgba(26,74,114,.07);
      --shadow-md:   0 6px 24px rgba(26,74,114,.10);
      --shadow-lg:   0 16px 48px rgba(26,74,114,.13);
      --font:        'Nunito', sans-serif;
      --font-body:   'Nunito Sans', sans-serif;
      --transition:  0.25s ease;
      /* Accessibility overrides (toggled by JS) */
      --font-scale: 1;
    }
    [data-theme="dark"] {
      --bg:        #111d26;
      --surface:   #172330;
      --text:      #ddeef8;
      --text-soft: #8ab5cc;
      --text-muted:#5a8099;
      --border:    #234358;
      --blue-ghost:#172330;
      --blue-pale: #1e3a50;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.3);
      --shadow-md: 0 6px 24px rgba(0,0,0,.35);
    }
    [data-contrast="high"] {
      --blue-deep:  #003d73;
      --blue-mid:   #004f99;
      --text:       #000000;
      --bg:         #ffffff;
      --surface:    #ffffff;
      --border:     #000000;
    }



    /* ── DIARY ─────────────────────────────────────────── */
    .diary-wrap {
      background: var(--surface); border-radius: var(--radius-lg);
      border: 1px solid var(--border); overflow: hidden;
    }
    .diary-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .diary-tab {
      flex: 1; padding: 14px 16px;
      background: none; border: none;
      font-family: var(--font); font-weight: 700;
      font-size: .88rem; cursor: pointer;
      color: var(--text-muted); transition: all var(--transition);
      border-bottom: 3px solid transparent; margin-bottom: -1px;
    }
    .diary-tab.active { color: var(--blue-deep); border-bottom-color: var(--blue-mid); background: var(--blue-ghost); }
    .diary-body { padding: 30px; }
    .diary-panel { display: none; }
    .diary-panel.active { display: block; animation: fadeIn .3s ease; }
    .diary-field { margin-bottom: 20px; }
    .diary-field label {
      display: block; font-family: var(--font);
      font-weight: 700; font-size: .88rem;
      color: var(--text); margin-bottom: 8px;
    }
    .diary-field select,
    .diary-field input[type="number"],
    .diary-field textarea {
      width: 100%; padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius); background: var(--bg);
      color: var(--text); font-family: var(--font-body);
      font-size: .92rem; transition: border-color var(--transition);
      outline: none; resize: vertical;
    }
    .diary-field select:focus,
    .diary-field input[type="number"]:focus,
    .diary-field textarea:focus { border-color: var(--blue-mid); }
    .emoji-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .emoji-btn {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 10px 16px;
      font-size: 1.3rem; cursor: pointer;
      transition: all var(--transition);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .emoji-btn span { font-size: .68rem; font-family: var(--font); font-weight: 700; color: var(--text-muted); }
    .emoji-btn.selected { border-color: var(--blue-mid); background: var(--blue-pale); }
    .emoji-btn:hover { transform: scale(1.05); }
    .range-wrap { display: flex; align-items: center; gap: 12px; }
    .range-wrap input[type="range"] {
      flex: 1; appearance: none;
      height: 6px; border-radius: 3px;
      background: var(--blue-pale); outline: none; border: none; padding: 0;
    }
    .range-wrap input[type="range"]::-webkit-slider-thumb {
      appearance: none; width: 18px; height: 18px;
      background: var(--blue-mid); border-radius: 50%; cursor: pointer;
    }
    .range-val {
      font-family: var(--font); font-weight: 800;
      color: var(--blue-deep); min-width: 28px; text-align: center;
    }
    .diary-save {
      background: var(--blue-mid); color: #fff; border: none;
      border-radius: 30px; padding: 13px 32px;
      font-family: var(--font); font-weight: 700; font-size: .95rem;
      cursor: pointer; transition: all var(--transition);
      display: flex; align-items: center; gap: 8px;
    }
    .diary-save:hover { background: var(--blue-deep); transform: translateY(-2px); }
    .diary-saved-msg {
      display: none; margin-top: 14px; padding: 12px 18px;
      background: #d1fae5; border-radius: var(--radius);
      color: #065f46; font-family: var(--font); font-weight: 700; font-size: .9rem;
    }
    .diary-saved-msg.show { display: flex; align-items: center; gap: 8px; }

    /* ── CONTACT ───────────────────────────────────────── */
    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start; }
    .contact-form { background: var(--surface); border-radius: var(--radius-lg); padding: 36px; border: 1px solid var(--border); }
    .contact-form h3 { font-family: var(--font); font-weight: 800; font-size: 1.2rem; margin-bottom: 6px; }
    .contact-form p { font-size: .88rem; color: var(--text-soft); margin-bottom: 24px; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-family: var(--font); font-weight: 700; font-size: .85rem; margin-bottom: 6px; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius); background: var(--bg);
      color: var(--text); font-family: var(--font-body);
      font-size: .92rem; transition: border-color var(--transition);
      outline: none; resize: vertical;
    }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--blue-mid); }
    .form-lgpd {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 16px 0 22px; font-size: .82rem; color: var(--text-soft); line-height: 1.55;
    }
    .form-lgpd input { width: auto; flex-shrink: 0; margin-top: 2px; }
    .contact-info { display: flex; flex-direction: column; gap: 18px; }
    .info-card {
      background: var(--surface); border-radius: var(--radius-lg);
      border: 1px solid var(--border); padding: 24px;
    }
    .info-card h4 { font-family: var(--font); font-weight: 800; margin-bottom: 14px; font-size: .95rem; }
    .info-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; font-size: .88rem; color: var(--text-soft); }
    .info-row i { color: var(--blue-mid); flex-shrink: 0; margin-top: 3px; }

    /* ── ADULT SECTION ─────────────────────────────────── */
    .adult-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    .adult-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 24px 20px; border: 1px solid var(--border);
      text-align: center; transition: all var(--transition);
    }
    .adult-card:hover { border-color: var(--teal); transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .adult-card i { font-size: 2rem; color: var(--teal); margin-bottom: 12px; display: block; }
    .adult-card h3 { font-family: var(--font); font-weight: 700; font-size: .95rem; margin-bottom: 8px; }
    .adult-card p { font-size: .83rem; color: var(--text-soft); line-height: 1.6; }


    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; gap: 40px; padding: 60px 24px 50px; }
      .hero-visual { padding: 28px; }
      .contact-grid { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
      .facts-row { grid-template-columns: 1fr; }
      .carteirinha-box { grid-template-columns: 1fr; }
      nav { display: none; }
      .burger { display: block; margin-left: auto; }
      .a11y-bar { padding: 8px 20px; }
    }

    @media (max-width: 600px) {
      .footer-grid { grid-template-columns: 1fr; }
      .section { padding: 50px 20px; }
      .audience-cards { grid-template-columns: 1fr 1fr; }
      .a11y-bar { gap: 6px; }
    }

    </style>

    <section id="diario" class="section" aria-labelledby="diario-title">

      <div class="diary-tabs" role="tablist">

          <div class="diary-field">

          <div class="diary-saved-msg" id="diary-saved-msg-adulto" role="status" aria-live="polite">

<script>
  /* ── ACCESSIBILITY ── */
  let fontScale = 1;
  let calmMode = false;

  function toggleDark() {
    const isDark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = isDark ? '' : 'dark';
    document.getElementById('btnDark').classList.toggle('active', !isDark);
  }
  function toggleContrast() {
    const isHigh = document.documentElement.dataset.contrast === 'high';
    document.documentElement.dataset.contrast = isHigh ? '' : 'high';
    document.getElementById('btnContrast').classList.toggle('active', !isHigh);
  }
  function changeFont(dir) {
    fontScale = Math.max(0.85, Math.min(1.4, fontScale + dir * 0.1));
    document.documentElement.style.setProperty('--font-scale', fontScale);
  }
  function toggleCalm() {
    calmMode = !calmMode;
    document.getElementById('btnCalm').classList.toggle('active', calmMode);
    // Remove animations in calm mode
    const style = document.getElementById('calmStyle') || document.createElement('style');
    style.id = 'calmStyle';
    style.textContent = calmMode ? '* { animation: none !important; transition: none !important; }' : '';
    document.head.appendChild(style);
  }

  /* ── MOBILE NAV ── */
  function toggleMobileNav() {
    const nav = document.getElementById('mobileNav');
    const btn = document.getElementById('burgerBtn');
    const isOpen = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', isOpen);
  }

  /* ── STICKY HEADER ── */
  window.addEventListener('scroll', () => {
    document.querySelector('header').style.boxShadow = window.scrollY > 10 ? 'var(--shadow-md)' : 'var(--shadow-sm)';
  });

  /* ── TABS ── */
  function switchTab(btn, panelId) {
    document.querySelectorAll('.tabs .tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    document.getElementById(panelId).classList.add('active');
  }
  function switchDiary(btn, panelId) {
    document.querySelectorAll('.diary-tab').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    document.querySelectorAll('.diary-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    document.getElementById(panelId).classList.add('active');
  }

  /* ── QUIZ ── */
  const quizQuestions = [
    { q: "A pessoa não responde consistentemente quando chamada pelo nome?", opts: ["Nunca ou raramente", "Às vezes", "Frequentemente", "Sempre"] },
    { q: "Há dificuldade notável em manter contato visual durante conversas?", opts: ["Não", "Às vezes", "Sim, bastante", "Sim, muito intensamente"] },
    { q: "Existem comportamentos repetitivos (balançar, girar objetos, rotinas rígidas)?", opts: ["Não", "Levemente", "Moderadamente", "Intensamente"] },
    { q: "Há sensibilidade extrema a sons, luzes, texturas ou cheiros?", opts: ["Não", "Levemente", "Moderadamente", "Muito intensamente"] },
    { q: "Há dificuldade em fazer amigos ou interações sociais parecem esgotantes?", opts: ["Não", "Às vezes", "Frequentemente", "Sempre"] },
    { q: "Existe foco muito intenso em um único tema ou assunto por longos períodos?", opts: ["Não", "Às vezes", "Com frequência", "É uma característica central"] },
    { q: "Há atraso na fala ou dificuldade de comunicar necessidades?", opts: ["Não", "Leve atraso", "Atraso significativo", "Sem fala funcional"] },
  ];
  let quizIndex = 0;
  let quizScore = 0;
  let quizSelected = null;

  function renderQuiz() {
    const q = quizQuestions[quizIndex];
    document.getElementById('quizQuestion').textContent = `${quizIndex+1}. ${q.q}`;
    document.getElementById('quizCounter').textContent = `Pergunta ${quizIndex+1} de ${quizQuestions.length}`;
    const fill = ((quizIndex)/quizQuestions.length*100).toFixed(0);
    document.getElementById('quizFill').style.width = fill + '%';
    document.getElementById('quizProgressBar').setAttribute('aria-valuenow', fill);
    const opts = document.getElementById('quizOptions');
    opts.innerHTML = '';
    q.opts.forEach((opt,i) => {
      const btn = document.createElement('button');
      btn.className = 'quiz-opt';
      btn.innerHTML = `<span class="quiz-opt-num">${String.fromCharCode(65+i)}</span>${opt}`;
      btn.setAttribute('aria-label', opt);
      btn.onclick = () => {
        opts.querySelectorAll('.quiz-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        quizSelected = i;
      };
      opts.appendChild(btn);
    });
    quizSelected = null;
    document.getElementById('quizNext').textContent = quizIndex < quizQuestions.length-1 ? 'Próxima →' : 'Ver resultado →';
  }

  function quizNext() {
    if (quizSelected === null) { alert('Por favor, selecione uma opção.'); return; }
    quizScore += quizSelected;
    quizIndex++;
    if (quizIndex >= quizQuestions.length) {
      showResult();
    } else { renderQuiz(); }
  }

  function showResult() {
    document.getElementById('quizFill').style.width = '100%';
    document.getElementById('quizBody').style.display = 'none';
    const res = document.getElementById('quizResult');
    res.classList.add('show');
    const max = (quizQuestions.length-1)*3;
    const pct = quizScore / max;
    let badge, title, text;
    if (pct < 0.35) {
      badge = 'low'; badge = '<span class="result-badge low">Indicadores baixos</span>';
      title = 'Poucos indicadores presentes';
      text = 'As respostas indicam poucos sinais associados ao TEA. Isso não descarta a possibilidade, mas sugere que buscar avaliação não é urgente. Se tiver dúvidas, converse com seu médico de confiança.';
    } else if (pct < 0.65) {
      badge = '<span class="result-badge mid">Indicadores moderados</span>';
      title = 'Vale conversar com um profissional';
      text = 'Algumas características levantadas merecem atenção. Recomendamos buscar avaliação com pediatra, psicólogo ou psiquiatra. Um diagnóstico precoce faz grande diferença. Procure o CAPS ou UBS da sua cidade.';
    } else {
      badge = '<span class="result-badge high">Indicadores significativos</span>';
      title = 'Busque avaliação especializada';
      text = 'O número de indicadores presentes sugere fortemente que vale buscar avaliação profissional o quanto antes. Isso não é diagnóstico — é um sinal de atenção. Procure o CAPS, pediatra ou neurologista. Quanto mais cedo, melhor.';
    }
    document.getElementById('resultBadge').outerHTML = badge;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultText').textContent = text;
  }

  function resetQuiz() {
    quizIndex = 0; quizScore = 0; quizSelected = null;
    document.getElementById('quizBody').style.display = 'block';
    document.getElementById('quizResult').classList.remove('show');
    document.getElementById('quizFill').style.width = '0%';
    renderQuiz();
  }

  /* ── DIARY ── */
  function selectEmoji(btn, group) {
    btn.closest('.emoji-row').querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }
  function updateRange(input, valId) {
    document.getElementById(valId).textContent = input.value;
  }
  function saveDiary(type) {
    const today = new Date().toISOString().split('T')[0];
    const msgId = type === 'crianca' ? 'diary-saved-msg' : 'diary-saved-msg-adulto';
    const msg = document.getElementById(msgId);
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 3000);
  }

  /* ── FORM ── */
  function submitForm() {
    const lgpd = document.getElementById('c-lgpd').checked;
    if (!lgpd) { alert('Por favor, autorize o uso dos seus dados para prosseguir.'); return; }
    document.getElementById('form-success').style.display = 'block';
  }

  /* ── SCROLL REVEAL ── */
  const revealEls = document.querySelectorAll('.reveal');
  const ro = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); ro.unobserve(e.target); } });
  }, { threshold: 0.12 });
  revealEls.forEach(el => ro.observe(el));

  /* ── SET TODAY DATE ── */
  const today = new Date().toISOString().split('T')[0];
  ['d-data','da-data'].forEach(id => { const el = document.getElementById(id); if(el) el.value = today; });

  /* ── INIT QUIZ ── */
  renderQuiz();
</script>
  </body>
  </html>
