<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue-50:  #eff8ff;
      --blue-100: #dbeffe;
      --blue-400: #38bdf8;
      --blue-500: #0ea5e9;
      --blue-600: #0284c7;
      --teal-400: #2dd4bf;
      --teal-500: #14b8a6;
      --teal-600: #0d9488;
      --neutral-50:  #f8fafc;
      --neutral-100: #f1f5f9;
      --neutral-200: #e2e8f0;
      --neutral-400: #94a3b8;
      --neutral-500: #64748b;
      --neutral-700: #334155;
      --neutral-900: #0f172a;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --gradient: linear-gradient(135deg, var(--blue-500) 0%, var(--teal-500) 100%);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-card: 0 4px 24px 0 rgba(14, 165, 233, 0.10), 0 1.5px 6px 0 rgba(0,0,0,0.06);
      --shadow-btn:  0 2px 10px 0 rgba(14, 165, 233, 0.30);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--neutral-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 480px; height: 480px;
      background: var(--blue-400);
      top: -120px; right: -100px;
    }
    body::after {
      width: 360px; height: 360px;
      background: var(--teal-400);
      bottom: -80px; left: -80px;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fff;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 48px 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    /* Logo mark */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--gradient);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--neutral-900);
      letter-spacing: -0.3px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--neutral-900);
      letter-spacing: -0.4px;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--neutral-500);
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Form */
    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--neutral-700);
      margin-bottom: 6px;
      letter-spacing: 0.2px;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap .icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--neutral-400);
      display: flex; align-items: center;
      pointer-events: none;
      transition: color 0.2s;
    }
    .input-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 40px;
      border: 1.5px solid var(--neutral-200);
      border-radius: var(--radius-sm);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--neutral-900);
      background: var(--neutral-50);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .input-wrap input::placeholder { color: var(--neutral-400); font-weight: 500; }
    .input-wrap input:focus {
      border-color: var(--blue-500);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
    }
    .input-wrap input:focus ~ .icon,
    .input-wrap:focus-within .icon { color: var(--blue-500); }

    /* Password toggle */
    .toggle-pw {
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--neutral-400);
      display: flex; align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--blue-500); }

    /* Forgot */
    .row-forgot {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 18px;
    }
    .link {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--blue-600);
      text-decoration: none;
      transition: color 0.15s;
    }
    .link:hover { color: var(--teal-600); }

    /* Error banner */
    .error-banner {
      display: none;
      align-items: flex-start;
      gap: 9px;
      background: var(--error-bg);
      border: 1.5px solid #fca5a5;
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #b91c1c;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .error-banner.visible { display: flex; }
    .error-banner svg { flex-shrink: 0; margin-top: 1px; }

    /* Submit */
    .btn-primary {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--gradient);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.92;
      box-shadow: 0 4px 18px 0 rgba(14,165,233,0.40);
      transform: translateY(-1px);
    }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-label { opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Input error state */
    .input-wrap input.input-error {
      border-color: var(--error);
      background: var(--error-bg);
    }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0 20px;
      color: var(--neutral-400);
      font-size: 0.78rem;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: var(--neutral-200);
    }

    /* Register link */
    .register-row {
      text-align: center;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--neutral-500);
    }
    .register-row .link { font-size: 0.88rem; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <span class="logo-name">Minha Plataforma</span>
  </div>

  <h1>Bem-vindo de volta</h1>
  <p class="subtitle">Entre com suas credenciais para continuar.</p>

  <div class="error-banner" id="errorBanner" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="errorMsg">Usuário ou senha incorretos.</span>
  </div>

  <div class="field">
    <label for="username">Usuário</label>
    <div class="input-wrap">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <input type="text" id="username" name="username" placeholder="seu.usuario" autocomplete="username" />
    </div>
  </div>

  <div class="field">
    <label for="password">Senha</label>
    <div class="input-wrap">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
      <button class="toggle-pw" type="button" id="togglePw" aria-label="Mostrar senha" tabindex="-1">
        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="row-forgot">
    <a href="#" class="link">Esqueci minha senha</a>
  </div>

  <button class="btn-primary" id="loginBtn" type="button">
    <div class="spinner"></div>
    <span class="btn-label">Entrar</span>
  </button>

  <div class="divider">ou</div>

  <div class="register-row">
    Não tem uma conta? <a href="#" class="link">Cadastre-se</a>
  </div>

</div>

<script>
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const loginBtn     = document.getElementById('loginBtn');
  const errorBanner  = document.getElementById('errorBanner');
  const errorMsg     = document.getElementById('errorMsg');
  const togglePw     = document.getElementById('togglePw');
  const eyeIcon      = document.getElementById('eyeIcon');

  // Password visibility toggle
  let pwVisible = false;
  togglePw.addEventListener('click', () => {
    pwVisible = !pwVisible;
    passwordInput.type = pwVisible ? 'text' : 'password';
    eyeIcon.innerHTML = pwVisible
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
         <circle cx="12" cy="12" r="3"/>`;
  });

  // Clear errors on input
  [usernameInput, passwordInput].forEach(el => {
    el.addEventListener('input', () => {
      el.classList.remove('input-error');
      errorBanner.classList.remove('visible');
    });
  });

  // Login
  loginBtn.addEventListener('click', handleLogin);
  [usernameInput, passwordInput].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); })
  );

  async function handleLogin() {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    // Basic validation
    if (!username || !password) {
      if (!username) usernameInput.classList.add('input-error');
      if (!password) passwordInput.classList.add('input-error');
      showError('Preencha usuário e senha.');
      return;
    }

    setLoading(true);
    hideError();

    try {
      const body = new URLSearchParams({ username, password, grant_type: 'password' });

      const res = await fetch('/auth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });

      if (res.ok) {
        const data = await res.json();
        // Store token (adjust key as needed)
        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);
          if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
        }
        // Redirect — adjust path as needed
        window.location.href = '/dashboard';
      } else {
        let msg = 'Usuário ou senha incorretos.';
        try {
          const err = await res.json();
          if (err.detail) msg = err.detail;
        } catch (_) {}

        if (res.status === 401 || res.status === 400) {
          usernameInput.classList.add('input-error');
          passwordInput.classList.add('input-error');
        } else if (res.status >= 500) {
          msg = 'Erro no servidor. Tente novamente em alguns instantes.';
        }
        showError(msg);
      }
    } catch (err) {
      showError('Não foi possível conectar ao servidor. Verifique sua conexão.');
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    loginBtn.disabled = on;
    loginBtn.classList.toggle('loading', on);
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorBanner.classList.add('visible');
  }

  function hideError() {
    errorBanner.classList.remove('visible');
  }
</script>
</body>
</html>
