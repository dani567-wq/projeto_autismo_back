<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laço Azul — Entrar</title>
    <link rel="stylesheet" href="login.css">
    <style>
        .tab-btns { display: flex; gap: 0; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #c8dde9; }
        .tab-btn  { flex: 1; padding: 10px; background: #eaf4fb; border: none; font-weight: 700; cursor: pointer; font-size: .9rem; transition: background .2s; }
        .tab-btn.active { background: #2d6fa0; color: #fff; }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        .error-msg { color: #c0392b; font-size: .85rem; margin-top: 8px; display: none; }
        .success-msg { color: #1a7a4a; font-size: .85rem; margin-top: 8px; display: none; }
        input { width: 100%; padding: 10px 14px; border: 1.5px solid #c8dde9; border-radius: 8px; margin-top: 4px; font-size: .95rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #2d6fa0; }
        button[type=submit] { width: 100%; padding: 12px; background: #2d6fa0; color: #fff; border: none; border-radius: 30px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 16px; transition: background .2s; }
        button[type=submit]:hover { background: #1a4a72; }
        button[type=submit]:disabled { background: #a0b5c8; cursor: not-allowed; }
    </style>
</head>
<body>
<main>
    <img src="" alt="" width="50px">
    <h1><b>Laço Azul</b></h1>
    
    <div class="tab-btns">
        <button class="tab-btn active" onclick="showTab('login')">Entrar</button>
        <button class="tab-btn" onclick="showTab('cadastro')">Cadastrar</button>
    </div>

    <!-- LOGIN -->
    <div id="panel-login" class="form-panel active">
        <form onsubmit="doLogin(event)">
            <label><h4>E-mail</h4></label>
            <input type="email" id="login-email" placeholder="seu@email.com" required>
            <label><h4>Senha</h4></label>
            <input type="password" id="login-senha" placeholder="sua senha" required>
            <div class="error-msg" id="login-error"></div>
            <button type="submit" id="login-btn">Entrar</button>
        </form>
        <p>Não tem conta? <a href="#" onclick="showTab('cadastro')">Cadastre-se</a></p>
    </div>

    <!-- CADASTRO -->
    <div id="panel-cadastro" class="form-panel">
        <form onsubmit="doCadastro(event)">
            <label><h4>Nome de usuário</h4></label>
            <input type="text" id="cad-nome" placeholder="seu nome" required>
            <label><h4>E-mail</h4></label>
            <input type="email" id="cad-email" placeholder="seu@email.com" required>
            <label><h4>Senha</h4></label>
            <input type="password" id="cad-senha" placeholder="mínimo 6 caracteres" required minlength="6">
            <div class="error-msg" id="cad-error"></div>
            <div class="success-msg" id="cad-success"></div>
            <button type="submit" id="cad-btn">Criar conta</button>
        </form>
        <p>Já tem conta? <a href="#" onclick="showTab('login')">Entrar</a></p>
    </div>
</main>

<script>
const API = 'http://localhost:8000';

function showTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='cadastro')));
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-cadastro').classList.toggle('active', tab === 'cadastro');
}

async function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const senha = document.getElementById('login-senha').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Entrando...';

    const body = new URLSearchParams({ username: email, password: senha });
    try {
        const res = await fetch(`${API}/auth/token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body
        });
        const data = await res.json();
        if (!res.ok) {
            errEl.textContent = data.detail || 'E-mail ou senha incorretos.';
            errEl.style.display = 'block';
        } else {
            localStorage.setItem('access_token', data.access_token);
            window.location.href = 'jh.html';
        }
    } catch {
        errEl.textContent = 'Erro de conexão com o servidor.';
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
    }
}

async function doCadastro(e) {
    e.preventDefault();
    const username = document.getElementById('cad-nome').value;
    const email = document.getElementById('cad-email').value;
    const password = document.getElementById('cad-senha').value;
    const btn = document.getElementById('cad-btn');
    const errEl = document.getElementById('cad-error');
    const sucEl = document.getElementById('cad-success');
    errEl.style.display = 'none'; sucEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Criando conta...';

    try {
        const res = await fetch(`${API}/users/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) {
            errEl.textContent = data.detail || 'Erro ao criar conta.';
            errEl.style.display = 'block';
        } else {
            sucEl.textContent = `Conta criada com sucesso! Faça login, ${data.username}.`;
            sucEl.style.display = 'block';
            setTimeout(() => showTab('login'), 2000);
        }
    } catch {
        errEl.textContent = 'Erro de conexão com o servidor.';
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false; btn.textContent = 'Criar conta';
    }
}
</script>
</body>
</html>
